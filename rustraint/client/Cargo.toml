[package]
name = "rustraint"
description = "Rustraint is client for Rustraintd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustraint"
path = "src/client.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
